<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA ICI - Loading</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        background: #0a0a14;
    }
    
    .gradient-bg {
        background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                    #0a0a14;
    }
    
    .spinner {
        width: 80px;
        height: 80px;
        position: relative;
    }
    
    .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid transparent;
        border-radius: 50%;
        animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    
    .spinner-ring:nth-child(1) {
        border-top-color: #6366f1;
        animation-delay: -0.45s;
        filter: drop-shadow(0 0 10px #6366f1);
    }
    
    .spinner-ring:nth-child(2) {
        border-right-color: #a855f7;
        animation-delay: -0.3s;
        filter: drop-shadow(0 0 10px #a855f7);
    }
    
    .spinner-ring:nth-child(3) {
        border-bottom-color: #3b82f6;
        animation-delay: -0.15s;
        filter: drop-shadow(0 0 10px #3b82f6);
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
    }
    
    .glow-text {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
        animation: pulseGlow 2s ease-in-out infinite;
    }
    
    @keyframes pulseGlow {
        0%, 100% { 
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
        }
        50% { 
            opacity: 0.8;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.7));
        }
    }
    
    .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        top: 0;
        left: 0;
        z-index: 0;
    }
    
    .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(99, 102, 241, 0.6);
        border-radius: 50%;
        animation: float 20s infinite;
    }
    
    @keyframes float {
        0%, 100% {
            transform: translateY(0) translateX(0);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        90% {
            opacity: 1;
        }
        100% {
            transform: translateY(-100vh) translateX(50px);
            opacity: 0;
        }
    }
    
    .progress-bar {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }
    
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #a855f7, #3b82f6);
        border-radius: 10px;
        animation: progressFill 3s ease-in-out forwards;
        box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
    }
    
    @keyframes progressFill {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    
    .fade-out {
        animation: fadeOut 0.5s ease-out forwards;
    }
    
    @keyframes fadeOut {
        to {
            opacity: 0;
            transform: scale(0.95);
        }
    }
</style>
</head>
<body>
    <div class="gradient-bg fixed inset-0 w-full h-full flex items-center justify-center" id="loadingScreen">
        <div class="particles" id="particles"></div>
        
        <div class="relative z-10 flex flex-col items-center justify-center gap-8">
            <!-- Spinner -->
            <div class="spinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
            
            <!-- Texto IA ICI -->
            <div class="text-center space-y-3">
                <h1 class="glow-text text-5xl md:text-6xl font-bold tracking-wider">
                    IA ICI
                </h1>
                <p class="text-gray-400 text-sm md:text-base font-light tracking-wide">
                    Carregando sistema...
                </p>
            </div>
            
            <!-- Barra de Progresso -->
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
        
        <!-- Grid de fundo decorativo -->
        <div class="absolute inset-0 opacity-20" style="background-image: linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO - EDITE O LINK DE DESTINO AQUI
        // ============================================
        const REDIRECT_URL = ' https://ruth-newport-biography-long.trycloudflare.com/ici/storage/IA/'; // <-- Troque pela sua URL
        const REDIRECT_DELAY = 3000; // Tempo em ms antes de redirecionar (3 segundos)
        // ============================================
        
        // Cria partículas animadas no fundo
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                
                // Varia cores das partículas
                const colors = ['rgba(99, 102, 241, 0.6)', 'rgba(168, 85, 247, 0.6)', 'rgba(59, 130, 246, 0.6)'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Inicia animação e redirecionamento
        function startLoading() {
            createParticles();
            
            // Redireciona após o tempo definido
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.classList.add('fade-out');
                
                // Aguarda animação de fade antes de redirecionar
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 500);
            }, REDIRECT_DELAY);
        }
        
        // Inicia quando a página carregar
        window.addEventListener('DOMContentLoaded', startLoading);
        
        // Previne scroll durante o loading
        document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
